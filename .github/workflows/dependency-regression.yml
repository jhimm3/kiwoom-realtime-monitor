name: 기능 보존 회귀

on:
  pull_request:
  push:
  schedule:
    - cron: '15 18 * * 1-6'
    - cron: '15 18 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: CI validation scope
        type: choice
        required: true
        default: comprehensive
        options:
          - comprehensive
          - nightly
          - auto

permissions:
  contents: read

concurrency:
  group: dependency-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-extended:
    name: Select extended regression
    runs-on: ubuntu-latest
    outputs:
      windows_fast: ${{ steps.route.outputs.windows_fast }}
      windows_long: ${{ steps.route.outputs.windows_long }}
      postgres: ${{ steps.route.outputs.postgres }}
      sealed: ${{ steps.route.outputs.sealed }}
      operator: ${{ steps.route.outputs.operator }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Select safe validation groups
        id: route
        shell: bash
        env:
          CI_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '15 18 * * 0' && 'weekly' || 'nightly') || github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/select_ci_groups.py --mode "$CI_MODE" --base-ref "$BASE_REF"
          --report tmp/regression/ci-selection.json --github-output "$GITHUB_OUTPUT"

      - name: Preserve selected and omitted group reasons
        uses: actions/upload-artifact@v7
        with:
          name: ci-selection-${{ github.run_id }}
          path: tmp/regression/ci-selection.json
          if-no-files-found: error
          retention-days: 14

  all-local:
    name: Windows all-local regression
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\tests\unit'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Check complete unit and integration test routes
        env:
          REGRESSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          REGRESSION_FALLBACK_REF: ${{ format('origin/{0}', github.event.repository.default_branch) }}
        run: python -m scripts.run_regression --check-new-test-modules

      - name: Install locked test dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Check architecture deltas without product imports
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: pwsh
        run: |
          $comparison = $env:ARCHITECTURE_BASE
          if (-not $comparison -or $comparison -match '^0+$') { $comparison = 'HEAD^' }
          python -m scripts.check_architecture --base-ref "$comparison" --report tmp/regression/architecture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check incremental test reviews without running tests
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -m scripts.check_test_changes --base-ref "$env:REVIEW_BASE" --report tmp/regression/test-review.json

      - name: Record selective impact and related audit items
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: pwsh
        run: |
          python -m scripts.check_test_changes --query --base-ref "$env:REVIEW_BASE" --limit 5 --report tmp/regression/test-selection.json
          if ($LASTEXITCODE -ne 0) {
            $selection = Get-Content tmp/regression/test-selection.json -Raw | ConvertFrom-Json
            if ($LASTEXITCODE -ne 2 -or $selection.status -ne 'full_required') { exit 1 }
            Write-Output 'Broad impact recorded; the existing comprehensive CI follows. No selective execution was accepted.'
            $global:LASTEXITCODE = 0
          }

      - name: Run complete local regression profile
        # Keep full coverage; measure the OS and runner scratch volumes before
        # the regression so elapsed-time changes can be compared on the same VM.
        shell: pwsh
        run: |
          @'
          import json, os, sqlite3, tempfile, time
          from pathlib import Path
          for label, parent in (("windows_os_temp", Path(os.environ["LOCALAPPDATA"]) / "Temp"),
                                ("github_runner_temp", Path(os.environ["RUNNER_TEMP"]))):
              with tempfile.TemporaryDirectory(prefix="kiwoom-io-probe-", dir=parent) as root:
                  connection = sqlite3.connect(Path(root) / "fixture.sqlite3")
                  connection.execute("PRAGMA journal_mode=WAL")
                  connection.execute("CREATE TABLE probe(value INTEGER)")
                  started = time.perf_counter()
                  for value in range(40):
                      with connection:
                          connection.execute("INSERT INTO probe VALUES(?)", (value,))
                  elapsed = time.perf_counter() - started
                  connection.close()
              print(json.dumps({"probe": "sqlite_commit", "location": label,
                                "parent": str(parent), "transactions": 40, "seconds": elapsed}))
          '@ | python -
          python -m scripts.run_regression --profile all-local --timeout-seconds 1800 --output tmp/regression/ci-all-local

      - name: Preserve regression report and worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-local-regression-${{ github.run_id }}
          path: tmp/regression/ci-all-local/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve incremental review separately from existing result layout
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incremental-test-review-${{ github.run_id }}
          path: |
            tmp/regression/test-review.json
            tmp/regression/test-selection.json
            tmp/regression/architecture.json
          if-no-files-found: warn
          retention-days: 14

  postgres-integration:
    name: Disposable PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwoom_monitor_diagnostic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwoom_monitor_diagnostic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      KIWOOM_DIAGNOSTIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies and PostgreSQL driver
        run: python -m pip install -r requirements.lock.txt

      - name: Run Linux-only POSIX regression modules
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import json
          import unittest
          from pathlib import Path
          from scripts.run_regression import _code_tree_identity, _IdentityTestResult, _suite_test_ids

          modules = json.loads(Path("tests/ci_groups.json").read_text(encoding="utf-8"))["linux_required"]
          source_start = _code_tree_identity()
          loader = unittest.defaultTestLoader
          runner = unittest.TextTestRunner(stream=sys.stdout, verbosity=2, resultclass=_IdentityTestResult)
          planned_ids, executed_ids, module_counts = [], [], []
          planned = 0
          ran = 0
          failures = errors = skipped = expected_failures = unexpected_successes = 0
          for module in modules:
              suite = loader.loadTestsFromName(module)
              count = suite.countTestCases()
              print(f"\n[{module}] discovered={count}")
              if count == 0:
                  errors += 1
                  print(f"ERROR: no tests discovered for {module}")
                  continue
              planned += count
              planned_ids.extend(_suite_test_ids(suite))
              module_counts.append({"module": module, "test_count": count})
              result = runner.run(suite)
              executed_ids.extend(result.executed_test_ids)
              ran += result.testsRun
              failures += len(result.failures)
              errors += len(result.errors)
              skipped += len(result.skipped)
              expected_failures += len(result.expectedFailures)
              unexpected_successes += len(result.unexpectedSuccesses)

          source_end = _code_tree_identity()
          print(
              "\nLinux platform regression: "
              f"modules={len(modules)} planned={planned} ran={ran} "
              f"failures={failures} errors={errors} skipped={skipped} "
              f"expected_failures={expected_failures} "
              f"unexpected_successes={unexpected_successes}"
          )
          passed = bool(planned) and ran == planned and not any((
              failures, errors, skipped, expected_failures, unexpected_successes,
          )) and source_start["lf_sha256"] == source_end["lf_sha256"] and planned_ids == executed_ids and len(set(executed_ids)) == len(executed_ids)
          Path("tmp/regression/postgres").mkdir(parents=True, exist_ok=True)
          Path("tmp/regression/postgres/linux-unit.json").write_text(json.dumps({
              "status": "passed" if passed else "failed", "modules": modules,
              "planned": planned, "ran": ran, "failures": failures, "errors": errors,
              "skipped": skipped, "expected_failures": expected_failures,
              "unexpected_successes": unexpected_successes,
              "source_start": source_start, "source_end": source_end,
              "planned_test_ids": planned_ids, "executed_test_ids": executed_ids, "module_test_counts": module_counts,
          }, indent=2) + "\n", encoding="utf-8")
          if not passed:
              raise SystemExit(1)
          PY

      - name: Prepare disposable database and run PostgreSQL boundary checks
        shell: bash
        env:
          KIWOOM_SERVER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
        run: |
          mkdir -p tmp/regression/postgres
          set -o pipefail
          python scripts/check_postgres_integration.py 2>&1 | tee tmp/regression/postgres/check-postgres-integration.log

      - name: Run required PostgreSQL integration suites
        shell: bash
        run: |
          mkdir -p tmp/regression/postgres
          set -o pipefail
          python scripts/run_postgres_access_integration.py \
            --ci-group postgres_required --report tmp/regression/postgres/required.json \
            2>&1 | tee tmp/regression/postgres/postgres-access-integration.log

      - name: Preserve PostgreSQL integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-${{ github.run_id }}
          path: tmp/regression/postgres/
          if-no-files-found: warn
          retention-days: 14

  postgres-extended:
    name: Extended PostgreSQL integration
    needs: [select-extended]
    if: ${{ needs['select-extended'].outputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwoom_monitor_diagnostic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwoom_monitor_diagnostic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      KIWOOM_DIAGNOSTIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Prepare fresh diagnostic schema
        shell: bash
        env:
          KIWOOM_SERVER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
        run: |
          mkdir -p tmp/regression/postgres-extended
          set -o pipefail
          python scripts/check_postgres_integration.py 2>&1 | tee tmp/regression/postgres-extended/schema.log
      - name: Run extended storage and replay suites
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_postgres_access_integration.py \
            --ci-group postgres_extended --report tmp/regression/postgres-extended/run.json \
            2>&1 | tee tmp/regression/postgres-extended/tests.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-postgres-${{ github.run_id }}
          path: tmp/regression/postgres-extended/
          if-no-files-found: error
          retention-days: 14

  sealed-replay:
    name: Sealed replay integration
    needs: [select-extended]
    if: ${{ needs['select-extended'].outputs.sealed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      KIWOOM_SERVER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Provision owned v1 replay DB and verify baseline
        shell: bash
        run: |
          mkdir -p tmp/regression/ci-sealed/secrets
          chmod 700 tmp/regression/ci-sealed/secrets
          set -o pipefail
          python scripts/check_recorded_replay_baseline.py --provision \
            --secrets-directory tmp/regression/ci-sealed/secrets \
            2>&1 | tee tmp/regression/ci-sealed/v1-baseline.log
      - name: Check v1 recorded execution on sealed DB
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_recorded_replay_baseline.py --execution-gates \
            --secrets-directory tmp/regression/ci-sealed/secrets \
            --report tmp/regression/ci-sealed/v1-execution.json \
            2>&1 | tee tmp/regression/ci-sealed/v1-execution.log
      - name: Build exact checkout runtime image for isolated v2
        shell: bash
        run: |
          docker build --label "com.kiwoom.ci-source=$GITHUB_SHA" \
            -f tests/ci_runtime.Dockerfile -t kiwoom-ci-runtime:local . \
            2>&1 | tee tmp/regression/ci-sealed/build.log
          docker pull postgres:17-alpine
          docker image inspect kiwoom-ci-runtime:local --format '{{.Id}}' > tmp/regression/ci-sealed/image-id
          docker image inspect postgres:17-alpine --format '{{.Id}}' > tmp/regression/ci-sealed/postgres-image-id
      - name: Confirm installed package matches the copied checkout source
        shell: bash
        run: |
          test "$(docker image inspect kiwoom-ci-runtime:local --format '{{index .Config.Labels "com.kiwoom.ci-source"}}')" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint python kiwoom-ci-runtime:local -I -c '
          from pathlib import Path
          import kiwoom_monitor
          source = Path("/app/src/kiwoom_monitor")
          installed = Path(kiwoom_monitor.__file__).parent
          files = list(source.rglob("*.py"))
          different = [str(path.relative_to(source)) for path in files
                       if not (installed / path.relative_to(source)).is_file()
                       or path.read_bytes() != (installed / path.relative_to(source)).read_bytes()]
          assert files and not different, different[:5]
          print(f"installed_source_parity=true python_files={len(files)}")'
      - name: Run empty-cluster v2 cache and TOP20 gates
        shell: bash
        run: |
          set -o pipefail
          sh scripts/run_ci_replay_cache.sh \
            "$(cat tmp/regression/ci-sealed/image-id)" \
            "$(cat tmp/regression/ci-sealed/postgres-image-id)" \
            2>&1 | tee tmp/regression/ci-sealed/v2-cache.log
      - name: Remove disposable replay secrets
        if: always()
        shell: bash
        run: |
          if [ -d tmp/regression/ci-sealed/secrets ]; then
            rm -f tmp/regression/ci-sealed/secrets/recorded-replay-database.json \
              tmp/regression/ci-sealed/secrets/recorded-replay-setup.lock
            rmdir tmp/regression/ci-sealed/secrets
          fi
      - name: Preserve replay outcomes without secret files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sealed-replay-${{ github.run_id }}
          path: |
            tmp/regression/ci-sealed/*.log
            tmp/regression/ci-sealed/v1-execution.json
          if-no-files-found: error
          retention-days: 14

  linux-operator:
    name: Offline Linux operator integration
    needs: [select-extended]
    if: ${{ needs['select-extended'].outputs.operator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned test runtime from this checkout
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/regression/ci-operator
          docker build --label "com.kiwoom.ci-source=$GITHUB_SHA" \
            -f tests/ci_runtime.Dockerfile -t kiwoom-ci-runtime:local . \
            2>&1 | tee tmp/regression/ci-operator/build.log
          docker image inspect kiwoom-ci-runtime:local --format '{{.Id}}' > tmp/regression/ci-operator/image-id
      - name: Verify image source and run offline filesystem gate
        shell: bash
        run: |
          set -o pipefail
          test "$(docker image inspect kiwoom-ci-runtime:local --format '{{index .Config.Labels "com.kiwoom.ci-source"}}')" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint python kiwoom-ci-runtime:local -I -c '
          from pathlib import Path
          import kiwoom_monitor
          source = Path("/app/src/kiwoom_monitor")
          installed = Path(kiwoom_monitor.__file__).parent
          files = list(source.rglob("*.py"))
          different = [str(path.relative_to(source)) for path in files
                       if not (installed / path.relative_to(source)).is_file()
                       or path.read_bytes() != (installed / path.relative_to(source)).read_bytes()]
          assert files and not different, different[:5]
          print(f"installed_source_parity=true python_files={len(files)}")'
          sh deploy/synology/check-nas-operator.sh \
            "$(cat tmp/regression/ci-operator/image-id)" \
            2>&1 | tee tmp/regression/ci-operator/tests.log
      - name: Preserve operator result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-operator-${{ github.run_id }}
          path: tmp/regression/ci-operator/*.log
          if-no-files-found: error
          retention-days: 14

  required-regression:
    name: Required regression
    runs-on: ubuntu-latest
    needs: [select-extended, all-local, postgres-integration, postgres-extended, sealed-replay, linux-operator]
    if: ${{ always() }}
    timeout-minutes: 10
    env:
      WINDOWS_JOB: ${{ needs['all-local'].result }}
      POSTGRES_JOB: ${{ needs['postgres-integration'].result }}
      SELECTION_JOB: ${{ needs['select-extended'].result }}
      PG_SELECTED: ${{ needs['select-extended'].outputs.postgres }}
      PG_EXTENDED_JOB: ${{ needs['postgres-extended'].result }}
      SEALED_SELECTED: ${{ needs['select-extended'].outputs.sealed }}
      OPERATOR_SELECTED: ${{ needs['select-extended'].outputs.operator }}
      SEALED_JOB: ${{ needs['sealed-replay'].result }}
      OPERATOR_JOB: ${{ needs['linux-operator'].result }}
    steps:
      - name: Check upstream job outcomes
        shell: bash
        run: |
          test "$WINDOWS_JOB" = success
          test "$POSTGRES_JOB" = success
          test "$SELECTION_JOB" = success
          if [ "$PG_SELECTED" = true ]; then test "$PG_EXTENDED_JOB" = success; else test "$PG_EXTENDED_JOB" = skipped; fi
          if [ "$SEALED_SELECTED" = true ]; then test "$SEALED_JOB" = success; else test "$SEALED_JOB" = skipped; fi
          if [ "$OPERATOR_SELECTED" = true ]; then test "$OPERATOR_JOB" = success; else test "$OPERATOR_JOB" = skipped; fi

      - name: Check out report validator
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download Windows result
        uses: actions/download-artifact@v7
        with:
          name: all-local-regression-${{ github.run_id }}
          path: tmp/ci-required/windows

      - name: Download Linux and PostgreSQL results
        uses: actions/download-artifact@v7
        with:
          name: postgres-integration-${{ github.run_id }}
          path: tmp/ci-required/postgres

      - name: Confirm all required contracts ran on matching source
        shell: bash
        run: |
          python -m scripts.run_regression --summarize tmp/ci-required/windows/run.json
          python -m scripts.check_required_ci_results --windows tmp/ci-required/windows/run.json \
            --linux tmp/ci-required/postgres/linux-unit.json \
            --postgres tmp/ci-required/postgres/required.json

      - name: Download selected sealed execution result
        if: ${{ env.SEALED_SELECTED == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: sealed-replay-${{ github.run_id }}
          path: tmp/ci-required/sealed

      - name: Confirm declared related tests actually ran
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          reports=(--execution tmp/ci-required/windows/run.json
                   --execution tmp/ci-required/postgres/linux-unit.json
                   --execution tmp/ci-required/postgres/required.json)
          if [ "$SEALED_SELECTED" = true ]; then
            reports+=(--execution tmp/ci-required/sealed/v1-execution.json)
          fi
          python -m scripts.check_test_changes --base-ref "$REVIEW_BASE" "${reports[@]}" \
            --report tmp/ci-required/test-review.json
