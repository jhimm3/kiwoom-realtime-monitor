name: 기능 보존 회귀

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-local:
    name: Windows all-local regression
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Check new unit test modules are registered
        env:
          REGRESSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          REGRESSION_FALLBACK_REF: ${{ format('origin/{0}', github.event.repository.default_branch) }}
        run: python scripts/run_regression.py --check-new-test-modules

      - name: Install locked test dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run complete local regression profile
        run: >-
          python scripts/run_regression.py --profile all-local
          --timeout-seconds 1800 --output tmp/regression/ci-all-local

      - name: Preserve regression report and worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-local-regression-${{ github.run_id }}
          path: tmp/regression/ci-all-local/
          if-no-files-found: warn
          retention-days: 14

  postgres-integration:
    name: Disposable PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwoom_monitor_diagnostic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwoom_monitor_diagnostic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      KIWOOM_DIAGNOSTIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies and PostgreSQL driver
        run: python -m pip install -r requirements.lock.txt

      - name: Prepare disposable database and run PostgreSQL boundary checks
        shell: bash
        env:
          KIWOOM_SERVER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwoom_monitor_diagnostic_test
        run: |
          mkdir -p tmp/regression/postgres
          set -o pipefail
          python scripts/check_postgres_integration.py 2>&1 | tee tmp/regression/postgres/check-postgres-integration.log

      - name: Run PostgreSQL access integration suite
        shell: bash
        run: |
          mkdir -p tmp/regression/postgres
          set -o pipefail
          python scripts/run_postgres_access_integration.py 2>&1 | tee tmp/regression/postgres/postgres-access-integration.log

      - name: Preserve PostgreSQL integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-${{ github.run_id }}
          path: tmp/regression/postgres/
          if-no-files-found: warn
          retention-days: 14
