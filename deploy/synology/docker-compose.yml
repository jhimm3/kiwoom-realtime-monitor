services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: kiwoom-monitor-server:2026.09.25-followup-newhigh-cache-v1
    build:
      context: ../..
      dockerfile: deploy/synology/server.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      KIWOOM_SERVER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      MONITOR_SERVER_ACCESS_TOKEN: ${MONITOR_SERVER_ACCESS_TOKEN}
      KIWOOM_SERVER_HOST: 0.0.0.0
      KIWOOM_SERVER_SECRET_DIR: /app/secrets
      CREDENTIAL_TRUSTED_PROXIES: "${KIWOOM_DOCKER_GATEWAY:-172.18.0.1}"
      CENTRAL_SERVER_LOG_DIR: /app/data/logs
      CENTRAL_SERVER_LOG_RETENTION_DAYS: ${CENTRAL_SERVER_LOG_RETENTION_DAYS:-14}
      KIWOOM_SERVER_PORT: ${KIWOOM_MONITOR_PORT:-8787}
      KIWOOM_ENVIRONMENT: ${KIWOOM_ENVIRONMENT}
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY}
      KIWOOM_SECRET_KEY: ${KIWOOM_SECRET_KEY}
      AUTONOMOUS_TOP20_ENABLED: ${AUTONOMOUS_TOP20_ENABLED:-1}
      MOCK_ACCOUNT_MONITOR_ENABLED: ${MOCK_ACCOUNT_MONITOR_ENABLED:-0}
      MOCK_ORDER_TRANSPORT_ENABLED: ${MOCK_ORDER_TRANSPORT_ENABLED:-0}
      KIWOOM_MOCK_APP_KEY: "${KIWOOM_MOCK_APP_KEY:-}"
      KIWOOM_MOCK_SECRET_KEY: "${KIWOOM_MOCK_SECRET_KEY:-}"
      MOCK_ACCOUNT_REF: "${MOCK_ACCOUNT_REF:-}"
      ACCOUNT_IDENTITY_HMAC_KEY: "${ACCOUNT_IDENTITY_HMAC_KEY:-}"
      ACCOUNT_IDENTITY_REGISTRY_ENABLED: ${ACCOUNT_IDENTITY_REGISTRY_ENABLED:-0}
      MOCK_EXECUTION_RUN_ID: "${MOCK_EXECUTION_RUN_ID:-}"
      TOP20_OUTBOX_PATH: /app/data/top20-index-outbox.json
      EXTERNAL_MARKET_ENABLED: ${EXTERNAL_MARKET_ENABLED:-1}
      EXTERNAL_MARKET_POLL_SECONDS: ${EXTERNAL_MARKET_POLL_SECONDS:-300}
      EXTERNAL_MARKET_SYMBOLS: ${EXTERNAL_MARKET_SYMBOLS:-NASDAQ_FUTURES:MNQU26.CME,WTI_FUTURES:CLV26.NYM}
      EXTERNAL_MARKET_AUTO_ROLL_ENABLED: ${EXTERNAL_MARKET_AUTO_ROLL_ENABLED:-1}
      EXTERNAL_MARKET_ROLL_CONFIRMATIONS: ${EXTERNAL_MARKET_ROLL_CONFIRMATIONS:-2}
      NAVER_NEWS_CLIENT_ID: ${NAVER_NEWS_CLIENT_ID}
      NAVER_NEWS_CLIENT_SECRET: ${NAVER_NEWS_CLIENT_SECRET}
      NEWS_REFRESH_SECONDS: ${NEWS_REFRESH_SECONDS}
      NEWS_NAVER_API_ENABLED: ${NEWS_NAVER_API_ENABLED:-true}
      NEWS_NAVER_STOCK_ENABLED: ${NEWS_NAVER_STOCK_ENABLED:-false}
      NEWS_HISTORY_JOBS_ENABLED: ${NEWS_HISTORY_JOBS_ENABLED:-true}
      NEWS_QUERY_SET_ENABLED: ${NEWS_QUERY_SET_ENABLED:-true}
      NEWS_QUERY_SET: "${NEWS_QUERY_SET:-증권,코스피,코스닥,상장사,수주 계약,유상증자,인수합병,실적 전망,최대주주}"
      NEWS_QUERY_SET_REFRESH_SECONDS: ${NEWS_QUERY_SET_REFRESH_SECONDS:-300}
      NEWS_PROCESSING_EXCLUDED_PROVIDERS: "${NEWS_PROCESSING_EXCLUDED_PROVIDERS:-}"
      NEWS_REQUEST_HARD_LIMIT: ${NEWS_REQUEST_HARD_LIMIT:-24000}
      NEWS_WATCHLIST_REQUEST_LIMIT: ${NEWS_WATCHLIST_REQUEST_LIMIT:-8000}
      NEWS_QUERY_SET_REQUEST_LIMIT: ${NEWS_QUERY_SET_REQUEST_LIMIT:-16000}
      MARKET_EVENT_COLLECTION_ENABLED: ${MARKET_EVENT_COLLECTION_ENABLED:-true}
      RESEARCH_OBSERVATION_HISTORY_ENABLED: ${RESEARCH_OBSERVATION_HISTORY_ENABLED:-true}
      SHADOW_CANDIDATE_ENABLED: ${SHADOW_CANDIDATE_ENABLED:-0}
      SHADOW_CANDIDATE_CONFIG_JSON: "${SHADOW_CANDIDATE_CONFIG_JSON:-}"
      SHADOW_CANDIDATE_POLL_SECONDS: ${SHADOW_CANDIDATE_POLL_SECONDS:-2}
      SHADOW_CANDIDATE_UNIVERSE_MAX_AGE_SECONDS: ${SHADOW_CANDIDATE_UNIVERSE_MAX_AGE_SECONDS:-0}
      HOT_COHORT_CONDITION_NAME: "${HOT_COHORT_CONDITION_NAME:-}"
      HOT_COHORT_CONDITION_SUBSTRING: "${HOT_COHORT_CONDITION_SUBSTRING:-15%}"
      DART_ENABLED: ${DART_ENABLED}
      DART_API_KEY: ${DART_API_KEY}
      DART_CACHE_PATH: ${DART_CACHE_PATH}
      NEWS_AI_PROVIDER: ${NEWS_AI_PROVIDER}
      NEWS_AI_MODEL: ${NEWS_AI_MODEL}
      NEWS_AI_DAILY_LIMIT: ${NEWS_AI_DAILY_LIMIT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "${KIWOOM_MONITOR_PORT:-8787}:${KIWOOM_MONITOR_PORT:-8787}"
    volumes:
      - ./server-data:/app/data
      - ./server-secrets:/app/secrets
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:${KIWOOM_MONITOR_PORT:-8787}/health', timeout=5))['status']=='ok'\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: "${KIWOOM_DOCKER_SUBNET:-172.18.0.0/24}"
          gateway: "${KIWOOM_DOCKER_GATEWAY:-172.18.0.1}"
