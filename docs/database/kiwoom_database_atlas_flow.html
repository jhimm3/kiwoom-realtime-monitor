<head>

<style>
:root{color-scheme:light;--ink:#18354b;--muted:#667b8d;--line:#dce5ec;--blue:#075fc5;--bg:#f3f6f9;--panel:#fff;--soft:#f7fafc;--nav:#102c41}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,'Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--nav);color:#fff;padding:28px 34px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9acbfa}.title{font-size:29px;line-height:1.25;margin:4px 0 8px}.sub{color:#c5d6e5;max-width:980px;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chips span{border:1px solid #496477;border-radius:999px;padding:4px 10px;font-size:12px;color:#d9e7f2}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1600px;margin:auto}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;border-right:1px solid var(--line);background:#f7f9fb}.homebtn,.domainnav{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;margin-bottom:7px;color:var(--ink)}.homebtn{font-weight:700;background:#eaf3fc;border-color:#b8d2e8}.domainnav small{display:block;color:var(--muted);font-size:11px}.side label{display:block;font-size:12px;font-weight:700;margin:16px 0 5px}.side input{width:100%;padding:9px 10px;border:1px solid #c6d4df;border-radius:8px;background:#fff}.side .hint{font-size:11px;color:var(--muted);margin:7px 2px 14px}.main{min-width:0;padding:26px 30px 70px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:23px;margin-bottom:20px}.tag,.logical,.physical{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700}.tag,.logical{background:#e5f1ff;color:#145e9e}.physical{background:#edf1f4;color:#556979}.panel h2{font-size:24px;line-height:1.25;margin:8px 0}.panel h3{font-size:17px;margin:0 0 12px}.help{color:var(--muted);font-size:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px}.metrics{text-align:right;color:var(--muted);font-size:12px}.metrics b{font-size:18px;color:var(--ink)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);gap:8px;align-items:stretch;margin:22px 0}.stage{border:1px solid #ccdce8;background:var(--soft);border-radius:10px;padding:14px}.stage b{display:block;font-size:11px;color:#51728b}.stage strong{display:block;font-size:15px;margin-top:5px}.stage small{display:block;color:var(--muted);margin-top:5px}.arrow{display:flex;align-items:center;justify-content:center;color:#8197aa;font-size:20px}
.map{display:grid;grid-template-columns:180px minmax(0,1fr) 180px;gap:16px;align-items:start;margin-top:14px}.maplabel{font-size:10px;font-weight:800;letter-spacing:.1em;color:#718496;margin-bottom:8px}.stack{display:flex;flex-direction:column;gap:8px}.edgecard{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:11px;font-size:12px}.edgecard strong{display:block;font-size:13px;margin-bottom:2px}.domains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.domaincard{position:relative;text-align:left;border:1px solid #bfd4e5;background:#fff;border-radius:11px;padding:14px;color:var(--ink);min-height:116px}.domaincard:hover{border-color:#2574ba;box-shadow:0 3px 12px rgba(16,44,65,.08)}.domaincard strong{display:block;font-size:15px;margin:5px 0}.domaincard small{display:block;color:var(--muted);font-size:11px;line-height:1.45}.count{position:absolute;top:12px;right:12px;color:var(--muted);font-size:10px}.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px}.legend span{display:flex;gap:6px;align-items:center}
.breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px}.breadcrumb button{border:0;background:none;color:var(--blue);padding:0}.domainflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.dstep{position:relative;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:14px;min-height:116px}.dstep:not(:last-child)::after{content:'→';position:absolute;right:-17px;top:42%;z-index:2;color:#8197aa;font-size:18px}.dstep b{display:block;color:#56748c;font-size:11px}.dstep strong{display:block;font-size:14px;margin-top:7px}.dstep p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tablecard{display:block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px;color:var(--ink)}.tablecard:hover{border-color:#2574ba;text-decoration:none}.tablecard strong{display:block;font-size:13px;margin:5px 0 1px}.tablecard code{display:block;font:11px/1.45 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.tablecard .goto{margin-top:7px;color:var(--blue);font-size:11px}.searchresults{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.empty{color:var(--muted);padding:18px 0}.notice{border-left:3px solid #d49a2d;background:#fff9e8;padding:11px 13px;font-size:12px;margin-top:14px}
@media(max-width:1050px){.map{grid-template-columns:1fr}.stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.domainflow{grid-template-columns:repeat(2,minmax(0,1fr))}.dstep:nth-child(2)::after{display:none}}
@media(max-width:820px){.layout{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side .navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.main{padding:18px 14px 50px}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.domains,.tables,.searchresults{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.metrics{text-align:left}.domainflow{grid-template-columns:1fr}.dstep::after{display:none!important}}
</style>
</head>

ntial_activations","자격증명 활성화 원장"],["central_credential_profiles","자격증명 프로필 목록"]]},{"group":"운영 메타","title":"DB 운영 메타","summary":"실제 시장 데이터가 아니라 중앙 DB 스키마의 적용 상태를 추적합니다.","source":"서버 배포 · migration runner","process":"스키마 적용","store":"migration 원장","use":"초기화 · 호환성 · 스키마 검증","tables":[["central_schema_migrations","중앙 스키마 적용 원장"]]}]</script>
<script>
'use strict';
const domains=JSON.parse(document.getElementById('domainData').textContent);
const allTables=domains.flatMap(d=>d.tables.map(t=>({name:t[0],label:t[1],group:d.group,title:d.title})));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const detail=name=>'atlas.html#'+encodeURIComponent(name);
function renderNav(){ $('nav').innerHTML=domains.map((d,i)=>`<button class="domainnav" data-i="${i}"><b>${esc(d.title)}</b><small>${d.tables.length}개 테이블 · ${esc(d.group)}</small></button>`).join(''); for(const b of document.querySelectorAll('.domainnav'))b.onclick=()=>showDomain(Number(b.dataset.i)); }
function overview(){history.replaceState(null,'','#');$('search').value='';$('content').innerHTML=`<section class="panel"><div class="hero"><div><span class="tag">전체 지도</span><h2>데이터는 네 단계만 먼저 보면 됩니다</h2><p>테이블 이름보다 먼저 <b>입력 → 처리 → NAS 저장 → 사용</b>을 봅니다.</p></div><div class="metrics">상세 구현 규모<br><b>43</b> 테이블 · 기존 Atlas에서 컬럼/PK/인덱스 확인</div></div><div class="flow"><div class="stage"><b>1 · 입력</b><strong>키움 · 뉴스 · 계좌 · 외부시장</strong><small>0B, TR, 순위/조건, 기사, 주문/체결</small></div><div class="arrow">→</div><div class="stage"><b>2 · 처리</b><strong>수신 · 집계 · 판정</strong><small>초/분 집계, TOP20, 뉴스 처리, 시장 이벤트</small></div><div class="arrow">→</div><div class="stage"><b>3 · 저장</b><strong>PostgreSQL · NAS</strong><small>원본, 현재 상태, 변경 이력, 소유권/완료 표식</small></div><div class="arrow">→</div><div class="stage"><b>4 · 사용</b><strong>앱 · 연구 · 자동매매</strong><small>차트, 후보 판단, 복구, 백테스트</small></div></div><div class="notice">아래 카드는 사람이 이해하기 위한 <b>논리 영역</b>입니다. 클릭하면 해당 영역에 속한 실제 물리 테이블만 보여줍니다.</div><div class="map"><div><div class="maplabel">들어오는 곳</div><div class="stack"><div class="edgecard"><strong>키움 실시간</strong>0B 체결 · 조건 · 순위</div><div class="edgecard"><strong>키움 TR</strong>분봉 · 일봉 · 기본정보</div><div class="edgecard"><strong>뉴스</strong>시장/종목 기사 · 본문</div><div class="edgecard"><strong>계좌·외부시장</strong>주문/체결 · 외부 지표</div></div></div><div><div class="maplabel">NAS 안의 데이터 영역</div><div class="domains">${domains.map((d,i)=>`<button class="domaincard" data-domain="${i}"><span class="logical">논리 영역</span><span class="count">${d.tables.length}개 테이블</span><strong>${esc(d.title)}</strong><small>${esc(d.summary)}</small></button>`).join('')}</div></div><div><div class="maplabel">쓰이는 곳</div><div class="stack"><div class="edgecard"><strong>앱 화면</strong>순위 · 차트 · 뉴스 · 계좌</div><div class="edgecard"><strong>자동매매</strong>후보 · 시장판단 · 주문 · 복구</div><div class="edgecard"><strong>연구</strong>고정 export · 재현 · 백테스트</div><div class="edgecard"><strong>운영/진단</strong>계보 · 정합성 · migration</div></div></div></div><div class="legend"><span><i class="logical">논리 영역</i> 사람이 이해하기 위한 기능 묶음</span><span><i class="physical">물리 테이블</i> PostgreSQL에 실제 존재하는 저장소</span></div></section><section class="panel"><h3>어디부터 보면 되나요?</h3><p class="help">실시간 DB 병목은 <b>가격·봉·실시간</b>, TOP20/수급/테마는 <b>TOP20·테마·기능 스냅샷</b>, 뉴스 저장 구조는 <b>뉴스 파이프라인</b>, 백테스트 계보는 <b>관측 계보·연구 데이터</b>부터 보면 됩니다.</p></section>`; for(const b of document.querySelectorAll('[data-domain]'))b.onclick=()=>showDomain(Number(b.dataset.domain)); }
function showDomain(i){const d=domains[i];if(!d)return overview();history.replaceState(null,'','#domain='+i);$('content').innerHTML=`<section class="panel"><div class="breadcrumb"><button id="crumb">전체 지도</button><span>›</span><span>${esc(d.title)}</span></div><span class="logical">논리 영역</span><h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p><div class="domainflow"><div class="dstep"><b>1 · 들어오는 데이터</b><strong>${esc(d.source)}</strong><p>원천/API/기능 입력</p></div><div class="dstep"><b>2 · 처리</b><strong>${esc(d.process)}</strong><p>앱과 서버에서 집계·정규화·판정</p></div><div class="dstep"><b>3 · NAS 저장</b><strong>${esc(d.store)}</strong><p>${d.tables.length}개 물리 테이블로 역할 분리</p></div><div class="dstep"><b>4 · 사용하는 곳</b><strong>${esc(d.use)}</strong><p>화면·연구·실행에서 읽음</p></div></div></section><section class="panel"><h3>이 분야의 실제 저장소 <small>(${d.tables.length})</small></h3><p class="help">여기부터 실제 PostgreSQL입니다. 클릭하면 기존 atlas.html에서 컬럼·PK·인덱스·Writer/Reader·코드 근거를 확인합니다.</p><div class="tables">${d.tables.map(t=>`<a class="tablecard" href="${detail(t[0])}"><span class="physical">물리 테이블</span><strong>${esc(t[1])}</strong><code>${esc(t[0])}</code><div class="goto">상세 Atlas 열기 →</div></a>`).join('')}</div></section>`;$('crumb').onclick=overview;window.scrollTo({top:0,behavior:'instant'});}
function search(q){q=q.trim().toLowerCase();if(!q)return overview();const found=allTables.filter(t=>(t.name+' '+t.label+' '+t.group+' '+t.title).toLowerCase().includes(q));history.replaceState(null,'','#search='+encodeURIComponent(q));$('content').innerHTML=`<section class="panel"><span class="tag">검색</span><h2>“${esc(q)}” 검색 결과</h2><p class="help">${found.length}개 테이블을 찾았습니다.</p><div class="searchresults">${found.map(t=>`<a class="tablecard" href="${detail(t.name)}"><span class="physical">${esc(t.title)}</span><strong>${esc(t.label)}</strong><code>${esc(t.name)}</code><div class="goto">상세 Atlas 열기 →</div></a>`).join('')||'<div class="empty">일치하는 테이블이 없습니다.</div>'}</div></section>`;}
$('homeBtn').onclick=overview;$('search').oninput=e=>search(e.target.value);renderNav();const h=location.hash.slice(1);if(h.startsWith('domain='))showDomain(Number(h.slice(7)));else overview();
</script>
</body>
</html>
