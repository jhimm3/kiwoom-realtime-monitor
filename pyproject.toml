[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-realtime-monitor"
version = "0.1.0"
description = "키움 REST API 기반 실시간 종목 모니터"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "websockets>=15,<17",
    "paddlepaddle>=3.3,<4",
    "paddleocr>=3.7,<4",
    "Pillow>=12,<13",
]

[project.scripts]
kiwoom-monitor = "kiwoom_monitor.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
